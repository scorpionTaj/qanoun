# Qanoun seed catalog — one entry per document file.
#
# Fields:
#   slug        unique id, used in URLs and the DB
#   group       groups bilingual editions of the same law (retrieval stays per-file)
#   title_ar / title_fr   display titles (title_fr optional for Arabic-only editions)
#   law_number  official number, e.g. "70-03" (null if unknown)
#   year        promulgation year
#   domain      one of qanoun_pipeline.catalog.DOMAINS
#   language    ar | fr
#   file        file name under data/raw/
#   source_url  where fetch downloads it from (Ministry of Justice portal)
#   sha256      integrity proof of the exact file
#
# To add a law: download the PDF from adala.justice.gov.ma, put it in data/raw/,
# run `shasum -a 256` on it, and fill an entry below.

