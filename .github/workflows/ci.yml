# Offline checks on every push and pull request: the same gates as `make test` + `make lint`
# + a production build. No database, LLM or embedding model is needed (tests fake them).
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Pipeline + API (pytest, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Lint
        run: uv run --project pipeline ruff check pipeline/src pipeline/tests backend/src backend/tests
      - name: Pipeline tests
        run: uv run --project pipeline pytest pipeline/tests -q
      - name: API tests
        run: uv run --project backend pytest backend/tests -q

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Server components fetch the API at request time only; the build needs no backend.
          NEXT_PUBLIC_API_URL: http://localhost:8000
