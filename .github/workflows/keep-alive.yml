name: Keep the demo database awake

# Supabase's free tier pauses a project after a week without traffic. Listing the legal
# domains through the live API reads the demo database, so a call every three days keeps it
# active. (/api/health does not touch the database, so it would not count.)
on:
  schedule:
    - cron: "41 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read from the demo database through the API
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 60 -o /dev/null https://qanoun-api-ma.vercel.app/api/domains
