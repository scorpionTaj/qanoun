# Weekly check of the Ministry of Justice portal for updated texts of the laws we carry.
#
# scripts/watch_portal.py finds newer uploads of each catalog law (same kind, language and
# number), downloads them, and keeps one only if its sha256 differs and it segments into at least
# 80% of the current file's articles, counted as ingestion counts them (with OCR). Updates are
# written to data/catalog/laws.yaml and proposed as a pull request with a report; new portal texts
# that cite one of our laws are listed in it. Nothing is ingested here.
#
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows: re-run CI from the PR.
name: Watch the legal portal

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: watch-portal
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.13"
          enable-cache: true
      - name: OCR (some laws have a broken text layer)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara tesseract-ocr-fra
      - name: Check the portal
        run: uv run --project pipeline python scripts/watch_portal.py --report watch-report.md
      - name: Summary
        if: always()
        run: test -f watch-report.md && cat watch-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Open a pull request with the updated catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/catalog/laws.yaml; then
            echo "No updated text: nothing to propose."
            exit 0
          fi
          branch="watch/portal-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/catalog/laws.yaml
          git commit -m "chore(catalog): updated texts on the legal portal ($(date -u +%Y-%m-%d))"
          git push --force -u origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --json number --jq '.[0].number')" ]; then
            gh pr create --base master --head "$branch" \
              --title "Updated texts on the legal portal ($(date -u +%Y-%m-%d))" --body-file watch-report.md
          fi
