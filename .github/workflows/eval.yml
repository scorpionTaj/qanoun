# Retrieval regression gate against the live demo database.
#
# Scores the question sets as typed (no LLM, so no answer quota is used) with the demo's
# embedder, and fails when a metric falls more than 0.02 below the last run of the same
# setup recorded in data/eval/history.jsonl. Runs weekly (the corpus or the embedding API
# can drift with no commit), on demand, and on pull requests that touch retrieval.
#
# Secrets: EVAL_DB_URL (the read-only qanoun_eval role: SELECT on laws/articles/chunks only)
# and QANOUN_JINA_KEY (embeds ~330 short questions per run).
name: Retrieval eval

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - backend/src/qanoun_api/rag/**
      - backend/src/qanoun_api/eval/**
      - pipeline/src/qanoun_pipeline/embed.py
      - pipeline/src/qanoun_pipeline/normalize.py
      - data/eval/**
      - .github/workflows/eval.yml

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval:
    name: Retrieval hit@10 / MRR vs baseline
    # Secrets are not given to pull requests from forks: skip those instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QANOUN_DB_URL: ${{ secrets.EVAL_DB_URL }}
      QANOUN_JINA_KEY: ${{ secrets.QANOUN_JINA_KEY }}
      QANOUN_EMBED_MODEL: jina-embeddings-v3
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Score retrieval and compare with the baseline
        run: |
          uv run --project backend python -m qanoun_api.eval.run --retrieval-only \
            --max-drop 0.02 --report eval-report.md 2>&1 | tee eval.log
          exit "${PIPESTATUS[0]}"
      - name: Summary
        if: always()
        run: |
          {
            echo "## Retrieval eval (jina-embeddings-v3, as typed)"
            grep -E "^raw:|^gate:|^retrieval regressed|^  [a-z_]+ \(" eval.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: |
            eval-report.md
            data/eval/history.jsonl
          retention-days: 30
