# TEMPORARY (removed before merge): runs eval/rerank_study.py against the demo database.
name: Rerank study
on:
  pull_request:
    paths: [.github/workflows/rerank-study.yml]
jobs:
  study:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QANOUN_DB_URL: ${{ secrets.EVAL_DB_URL }}
      QANOUN_JINA_KEY: ${{ secrets.QANOUN_JINA_KEY }}
      QANOUN_EMBED_MODEL: jina-embeddings-v3
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.13"
          enable-cache: true
      - shell: bash
        run: |
          set -o pipefail
          uv run --project backend python -m qanoun_api.eval.rerank_study --pool 20 --cache rerank-cache.json \
            | tee study.md
          cat study.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rerank-study
          path: |
            study.md
            rerank-cache.json
