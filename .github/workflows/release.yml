# Container images on GitHub Container Registry.
#
#   ghcr.io/<owner>/qanoun-api  slim API: remote embeddings (QANOUN_EMBED_MODEL=jina-embeddings-v3);
#                               for local BGE-M3, build with --build-arg EXTRAS=models
#   ghcr.io/<owner>/qanoun-web  web app; the API URL is set at runtime (QANOUN_API_URL for server
#                               rendering, QANOUN_PUBLIC_API_URL for browsers)
#
# A tag v1.2.3 publishes 1.2.3, 1.2 and latest, for linux/amd64 and linux/arm64. Pull requests
# that touch the images build them without pushing.
name: Release images

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - backend/Dockerfile
      - frontend/Dockerfile
      - .dockerignore
      - frontend/.dockerignore
      - .github/workflows/release.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qanoun-api
            context: .
            file: backend/Dockerfile
          - name: qanoun-web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Image name (registry paths must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
