# Container images on GitHub Container Registry.
#
#   ghcr.io/<owner>/qanoun-api  slim API: remote embeddings (QANOUN_EMBED_MODEL=jina-embeddings-v3);
#                               for local BGE-M3, build with --build-arg EXTRAS=models
#   ghcr.io/<owner>/qanoun-web  web app; the API URL is set at runtime (QANOUN_API_URL for server
#                               rendering, QANOUN_PUBLIC_API_URL for browsers)
#
# A tag v1.2.3 publishes 1.2.3, 1.2 and latest, for linux/amd64 and linux/arm64. Pull requests
# that touch the images build them without pushing.
#
# The same tag builds the Android app (mobile/): qanoun-1.2.3.apk to install directly and
# qanoun-1.2.3.aab for the Play Store, attached to the GitHub release v1.2.3. They are signed
# with the upload key from the ANDROID_* secrets (see mobile/README.md), or with the debug key
# when those are not set, which installs fine but is refused by the Play Store.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - backend/Dockerfile
      - frontend/Dockerfile
      - .dockerignore
      - frontend/.dockerignore
      - .github/workflows/release.yml
      - mobile/plugins/**

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qanoun-api
            context: .
            file: backend/Dockerfile
          - name: qanoun-web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Image name (registry paths must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  android:
    name: Android app (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # attach the files to the release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Version (from the tag; the build number always goes up)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(jq -r .expo.version app.json)"; fi
          jq --arg v "$VERSION" --argjson n "$GITHUB_RUN_NUMBER" '.expo.version = $v | .expo.android.versionCode = $n' \
            app.json > app.tmp && mv app.tmp app.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: signing with the debug key (not accepted by the Play Store)"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        working-directory: mobile/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/qanoun-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/qanoun-$VERSION.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: qanoun-android
          path: mobile/dist/
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
