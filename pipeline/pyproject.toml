[project]
name = "qanoun-pipeline"
version = "0.2.0"
description = "Data engineering pipeline for Qanoun: fetch, parse, structure, chunk, embed and load Moroccan legal texts"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pymupdf>=2.1",
    "psycopg[binary]>=3.3.9",
    "pgvector>=0.5.1",
    "pyyaml>=6.0.4",
]

[project.optional-dependencies]
# Torch + sentence-transformers for the real embedding model (BGE-M3). Kept optional so
# CI and tests stay light; `make ingest` installs it via `uv run --extra models`.
models = ["sentence-transformers>=6.3.0", "torch>=2.15.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# On Linux, torch from PyTorch's CPU-only index: PyPI's Linux wheel bundles CUDA (a 20 GB
# Docker image). macOS and Windows keep PyPI's wheels. For a CUDA GPU server, drop the marker.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
