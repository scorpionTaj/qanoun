[project]
name = "qanoun-pipeline"
version = "0.1.0"
description = "Data engineering pipeline for Qanoun: fetch, parse, structure, chunk, embed and load Moroccan legal texts"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Torch + sentence-transformers for the real embedding model (BGE-M3). Kept optional so
# CI and tests stay light; `make ingest` installs it via `uv run --extra models`.
models = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
